<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark rounded tile (same style as Cerebrum) -->
  <rect width="32" height="32" rx="7" fill="#0a0a0a"/>
  <!-- "N" shape: left vertical + diagonal + right vertical, as open arcs -->
  <!-- Left vertical arc -->
  <path d="M9 24V8" stroke="#fafafa" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Diagonal stroke -->
  <path d="M9 8L23 24" stroke="#fafafa" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Right vertical (accent — neural highlight) -->
  <path d="M23 24V8" stroke="#a78bfa" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  <!-- Center data point (same concept as Cerebrum's dot) -->
  <circle cx="16" cy="16" r="2" fill="#a78bfa"/>
</svg>
